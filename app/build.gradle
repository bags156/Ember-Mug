plugins { id 'com.android.application' }
android {
    namespace 'com.bags156.embermug'
    compileSdk 36
    defaultConfig {
        applicationId 'com.bags156.embermug'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'com.bags156.embermug.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
