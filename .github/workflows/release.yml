name: Release APK

# Publishes a GitHub Release with a signed APK whenever version.txt names a version that has
# not been released yet. To release: change version.txt (e.g. 0.2.0) and push.
#
# Every build is signed with the public key in signing/, so a release installs over the
# previous one (and Obtainium can update in place). No secrets are needed.

on:
  push:
    branches:
      - main
      - claude/ember-mug-app
    paths:
      - version.txt
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Read the version
        id: version
        run: |
          VERSION="$(tr -d ' \n\r' < version.txt)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "::error::version.txt must look like 1.2.3, got '$VERSION'"
            exit 1
          fi
          TAG="v$VERSION"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is already released; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        if: steps.version.outputs.publish == 'true'

      - name: Install Android SDK packages
        if: steps.version.outputs.publish == 'true'
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Unit tests and signed release build
        if: steps.version.outputs.publish == 'true'
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify the signature
        if: steps.version.outputs.publish == 'true'
        run: |
          APK="Ember-Mug-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        run: |
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ember Mug $TAG" \
            --generate-notes
