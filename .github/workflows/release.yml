name: Release APK

# Push a tag like v0.2.0 to publish a GitHub Release with a signed APK attached.
# Every release is signed with the same key, so it installs over the previous one
# (and Obtainium can update in place).
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEYSTORE_B64     the PKCS12 keystore, base64-encoded (key alias "embermug")
#   SIGNING_STORE_PASSWORD   its password

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Load the signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_B64 and SIGNING_STORE_PASSWORD repository secrets first."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Unit tests and signed release build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify the signature
        run: |
          APK="Ember-Mug-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Ember Mug $GITHUB_REF_NAME" \
            --generate-notes --verify-tag
